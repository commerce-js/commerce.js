# https://github.com/actions/deploy-pages#usage
name: Deploy Docs to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/docs/**'
      - 'packages/ui/**'
      - 'packages/types/**'

jobs:
  # Fail-fast integrity gate (docs/security/2026-07-18-repo-compromise.md).
  # Runs first with no pnpm install; the jobs below `needs:` it so a poisoned
  # tree never reaches install/build/publish.
  security-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ci/security-guard.mjs

  build:
    needs: security-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm turbo run build --filter='docs^...'

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3

      - name: Build docs
        working-directory: apps/docs
        run: |
          npx nuxt build --preset github_pages || true
          # Verify build output was generated (prerender 404s from demo links are non-fatal)
          test -f .output/public/index.html || (echo "Build failed — no output generated" && exit 1)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/.output/public

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
