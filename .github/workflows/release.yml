# Release — Runs when code is pushed to main (after merging a PR).
#
# What it does:
#   1. Builds all packages
#   2. Checks if there are any changesets (version bump descriptions)
#   3. If changesets exist:
#      → Opens a PR titled "Version Packages" that bumps versions and writes changelogs
#   4. If the "Version Packages" PR itself was just merged:
#      → Publishes the updated packages to npm
#
# SETUP REQUIRED (one-time):
#   Configure Trusted Publishing on npmjs.com for each package:
#   1. Go to npmjs.com → your package → Settings → Trusted Publishers
#   2. Select "GitHub Actions"
#   3. Enter: org = commerce-js, repo = commerce.js, workflow = release.yml
#
#   No tokens needed! GitHub and npm use OIDC to authenticate securely.

name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write    # Required for npm trusted publishing (OIDC)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build publishable packages
        run: pnpm turbo run build --filter='@commercejs/*'

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
