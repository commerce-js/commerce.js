# ---------------------------------------------------------------------------
# CommerceJS Cloud — Fly.io app config
# ---------------------------------------------------------------------------
# Region: bah (Bahrain) — closest to GCC/MENA primary market.
# Two processes: `web` (Nitro server) + `worker` (BullMQ consumer). They
# share the same image; fly.toml's [processes] table tells each machine
# which command to run, overriding the Dockerfile CMD on the worker tier.
# `web` auto-suspends on idle to keep cost ~$2/mo on shared-cpu; `worker`
# stays on so the queue is always being drained.
# ---------------------------------------------------------------------------

app = "commercejs-cloud"
primary_region = "bah"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"

[processes]
  web = "node .output/server/index.mjs"
  worker = "node .output/worker.mjs"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/_health"
    timeout = "5s"
